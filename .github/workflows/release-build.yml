name: Release builds
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: both
        options: [both, windows, linux]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-22.04"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["windows-latest","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev xvfb xdotool libfuse2 desktop-file-utils squashfs-tools
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci --ignore-scripts
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - run: node test/collect-licenses.cjs artifacts/licenses
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native tests and Windows vault interchange
        env:
          NORDSSH_FIXTURE_INPUT: ${{ github.workspace }}/test/fixtures/windows-v1.json
          NORDSSH_FIXTURE_OUTPUT: ${{ runner.temp }}/interchange-${{ runner.os }}.nordvault
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Build older Windows upgrade fixture
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node test/build-baseline.cjs
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri -- build --bundles nsis
      - name: Build Linux installer and AppImage
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri -- build --bundles deb,appimage
      - name: Native Windows first-launch UI
        if: runner.os == 'Windows'
        run: node test/native-windows.cjs
      - name: Package and sign release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node test/package-release.cjs
      - name: Windows install, upgrade and portable update checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/windows-install.ps1 -Installer artifacts/release/NordSSH-0.1.0-windows-x64-setup.exe
      - name: Debian install and upgrade checks
        if: runner.os == 'Linux'
        run: bash test/linux-install.sh artifacts/release/NordSSH-0.1.0-linux-amd64.deb
      - name: Linux portable native startup
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a bash test/linux-startup.sh "$PWD/artifacts/portable-linux/NordSSH.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ runner.os }}
          path: artifacts/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: interchange-${{ runner.os }}
          path: ${{ runner.temp }}/interchange-${{ runner.os }}.nordvault
          if-no-files-found: error

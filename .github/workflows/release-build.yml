name: Release builds
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: both
        options: [both, windows, linux]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-22.04"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["windows-latest","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev xvfb xdotool libfuse2 desktop-file-utils squashfs-tools
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native tests and Windows vault interchange
        env:
          NORDSSH_FIXTURE_INPUT: ${{ github.workspace }}/test/fixtures/windows-v1.json
          NORDSSH_FIXTURE_OUTPUT: ${{ runner.temp }}/interchange-${{ runner.os }}.nordvault
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --no-bundle
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles appimage --config '{"bundle":{"active":true,"icon":["icons/128x128.png"]}}'
      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/portable -Force | Out-Null
          Copy-Item src-tauri/target/release/nordssh.exe artifacts/portable/NordSSH.exe
          Copy-Item assets/portable/nordssh.portable artifacts/portable/
          Copy-Item assets/portable/README.txt artifacts/portable/
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/NordSSH-0.1.0-beta.1-windows-x64-portable.zip
      - name: Linux native startup smoke and portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/portable
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/portable/NordSSH.AppImage
          cp assets/portable/nordssh.portable assets/portable/README.txt artifacts/portable/
          chmod +x artifacts/portable/NordSSH.AppImage
          xvfb-run -a bash test/linux-startup.sh "$PWD/artifacts/portable/NordSSH.AppImage"
          tar -czf artifacts/NordSSH-0.1.0-beta.1-linux-x64-portable.tar.gz -C artifacts/portable NordSSH.AppImage nordssh.portable README.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ runner.os }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: interchange-${{ runner.os }}
          path: ${{ runner.temp }}/interchange-${{ runner.os }}.nordvault
          if-no-files-found: error

name: Legacy web prototype checks
on:
  push:
    paths: ['src/**', 'src-tauri/**', 'test/**', 'package*.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'test/**', 'package*.json', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci --ignore-scripts
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - run: node test/collect-licenses.cjs artifacts/licenses
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: npm audit --omit=dev --audit-level=moderate

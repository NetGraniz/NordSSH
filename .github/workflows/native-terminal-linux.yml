name: Native Linux terminal engineering
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/qt-sdk/lib
      QT_PLUGIN_PATH: ${{ github.workspace }}/qt-sdk/plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ghostty-org/ghostty
          ref: 08a9518340e19487bd5fdf96963583fb32f0c41f
          path: vt-source
          persist-credentials: false
      - name: Isolated runner dependencies and real TUI programs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libb2-1 libdouble-conversion3 fonts-dejavu-core fonts-noto-cjk xvfb xauth weston vim nano less procps tmux
      - name: Acquire hash-verified Qt 6.12.0 engineering SDK
        run: python3 native/scripts/acquire-qt-linux.py "$GITHUB_WORKSPACE/qt-sdk"
      - name: Apply reviewed exact-pin terminal engine patch
        shell: pwsh
        run: ./native/scripts/patch-ghostty.ps1 -Source vt-source
      - name: Acquire hash-verified Zig and build ReleaseSafe VT SDK
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz' --output "$RUNNER_TEMP/zig.tar.xz"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          cd vt-source
          "$RUNNER_TEMP/zig-x86_64-linux-0.17.0/zig" build -Demit-lib-vt -Demit-themes=false -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe -Dsimd=false -j1 --summary all
      - name: Build Qt adapter and test-only driver
        run: |
          cmake -S native -B native/build-linux-terminal -DCMAKE_BUILD_TYPE=Debug -DNORDSSH_BUILD_TERMINAL=ON -DNORDSSH_BUILD_TUI_TESTS=ON -DNORDSSH_BUILD_VT_GATE=ON -DNORDSSH_GHOSTTY_SDK="$GITHUB_WORKSPACE/vt-source/zig-out" -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/qt-sdk"
          cmake --build native/build-linux-terminal --parallel 2
      - name: Component tests and actual offscreen TUI programs
        run: ctest --test-dir native/build-linux-terminal --output-on-failure
      - name: Actual TUI programs through Qt X11 raster widgets
        run: xvfb-run -a python3 native/tests/tui_fixture.py native/build-linux-terminal/terminal_tui_driver --qpa xcb
      - name: Actual TUI programs through Qt Wayland raster widgets
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=nordssh-wayland --idle-time=0 --log="$RUNNER_TEMP/nordssh-weston.log" &
          task_weston_pid=$!
          trap 'kill "$task_weston_pid" || true' EXIT
          for task_attempt in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/nordssh-wayland" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/nordssh-wayland"
          WAYLAND_DISPLAY=nordssh-wayland python3 native/tests/tui_fixture.py native/build-linux-terminal/terminal_tui_driver --qpa wayland
